[workspace]
resolver = "2"
exclude = ["scripts/macro-diagnostics-regression", "vendor/glib-macros-0.18.5", "vendor/gtk3-macros-0.18.2", "vendor/glib-0.18.5", "scripts/glib-variant-regression", "scripts/glib-advisory-reference"]
members = [
    "crates/domain",
    "crates/core",
    "crates/data",
    "crates/resources",
    "crates/application",
    "crates/app",
]

[workspace.package]
version = "1.3.1"
edition = "2021"
license = "Apache-2.0"
authors = ["Racoon Typper Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# Canonical completion payloads must retain every f64 bit when read back.
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

# Workspace internal deps
racoon-domain = { path = "crates/domain" }
racoon-core = { path = "crates/core" }
racoon-data = { path = "crates/data" }
racoon-resources = { path = "crates/resources" }
racoon-application = { path = "crates/application" }

# Shared deps
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
uuid = { version = "1", features = ["serde", "v7"] }

[profile.release]
strip = true
lto = "thin"

# Narrow backport of gtk-rs PR #1343; see ADR 0007.
[patch.crates-io]
glib = { path = "vendor/glib-0.18.5" }

# Upstream diagnostic backports; see ADR 0008.
glib-macros = { path = "vendor/glib-macros-0.18.5" }
gtk3-macros = { path = "vendor/gtk3-macros-0.18.2" }
