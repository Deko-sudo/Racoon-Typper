[[quotes]]
text = "平靜的雙手帶來穩定的進步。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "練習把細小的步驟變成能力。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "每一下準確的按鍵都會建立信心。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "安靜的節奏有助於找到下一個字。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "良好的打字由專注開始。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "讓雙手保持輕盈，讓心思留在當下。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "短時間練習能建立持久習慣。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "準確度為速度打下可靠基礎。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "讀清楚一行，找到按鍵，然後繼續。"
author = "Racoon Typper Contributors"

[[quotes]]
text = "持續練習會令複雜的模式變得熟悉。"
author = "Racoon Typper Contributors"
