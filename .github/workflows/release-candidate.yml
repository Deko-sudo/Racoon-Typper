name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

env:
  TAURI_DRIVER_VERSION: "2.0.6"

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]
          git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.tag }}'
          expected="${expected#v}"
          actual="$(node scripts/check-version.mjs --print)"
          test "$actual" = "$expected"

  build-linux:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build Tauri app
        run: npm run tauri:build:ci --prefix frontend
      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          tar czf racoon-typper-${{ needs.validate-tag.outputs.tag }}-x86_64.tar.gz -C target/release racoon-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: racoon-typper-linux
          path: |
            target/release/bundle/**
            racoon-typper-*.tar.gz
          if-no-files-found: error

  validate-flatpak-manifest:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: node scripts/validate-flatpak-manifest.mjs

  build-windows:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build NSIS installer
        run: npm run tauri:build:ci --prefix frontend
      - name: Provision pinned tauri-driver for the UI smoke
        shell: pwsh
        run: |
          cargo install tauri-driver --locked --version $env:TAURI_DRIVER_VERSION
          $exe = Join-Path $env:USERPROFILE '.cargo/bin/tauri-driver.exe'
          if (-not (Test-Path $exe)) { throw 'tauri-driver.exe was not produced by cargo install' }
          Write-Host "tauri-driver $env:TAURI_DRIVER_VERSION at $exe"
          New-Item -ItemType Directory -Force -Path .cargo-tauri-driver | Out-Null
          Copy-Item $exe .cargo-tauri-driver/tauri-driver.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: racoon-typper-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tauri-driver-windows
          path: ${{ github.workspace }}/.cargo-tauri-driver/tauri-driver.exe
          if-no-files-found: error

  windows-installer-smoke:
    needs: [validate-tag, build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: racoon-typper-windows
          path: artifacts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tauri-driver-windows
          path: tauri-driver
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Install WebDriver client dependency
        run: npm install --prefix frontend --no-save selenium-webdriver@4.47.0
      - name: Install, drive, save, and restart NSIS package through tauri-driver
        shell: pwsh
        env:
          TAURI_DRIVER_VERSION: ${{ env.TAURI_DRIVER_VERSION }}
        run: |
          $installer = Get-ChildItem -Path artifacts -Filter '*.exe' -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw 'NSIS installer artifact was not found' }
          $tauriDriverExe = (Get-ChildItem -Path tauri-driver -Filter 'tauri-driver.exe' -Recurse | Select-Object -First 1).FullName
          if (-not $tauriDriverExe) { throw 'tauri-driver.exe artifact was not found' }
          ./scripts/windows-nsis-smoke.ps1 -Installer $installer -TauriDriverExe $tauriDriverExe

  linux-package-smoke:
    needs: [validate-tag, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: racoon-typper-linux
          path: artifacts
      - name: Install, launch, persist, and restart Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifacts -type f -name '*.deb' -print -quit)"
          test -n "$package"
          bash scripts/linux-package-smoke.sh "$package"

  appimage-smoke:
    needs: [validate-tag, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: racoon-typper-linux
          path: artifacts
      - name: Launch, persist, and restart the AppImage
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find artifacts -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          bash scripts/appimage-smoke.sh "$appimage"

  publish-draft:
    needs: [validate-tag, build-linux, build-windows, linux-package-smoke, appimage-smoke, windows-installer-smoke, validate-flatpak-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Attach SBOM and provenance records
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          test -s licenses/sbom.cdx.json
          test -s licenses/PROVENANCE_ATTESTATION.md
          mkdir -p artifacts/release-evidence
          cp licenses/sbom.cdx.json artifacts/release-evidence/racoon-typper.sbom.cdx.json
          cp licenses/PROVENANCE_ATTESTATION.md artifacts/release-evidence/PROVENANCE_ATTESTATION.md
          node - <<'NODE' > artifacts/release-evidence/release-manifest.json
          const fs = require('node:fs');
          const sbom = JSON.parse(fs.readFileSync('licenses/sbom.cdx.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (sbom.metadata?.component?.version !== tag.slice(1)) {
            throw new Error('SBOM component version does not match release tag');
          }
          process.stdout.write(`${JSON.stringify({
            schema: 1,
            tag,
            commit: process.env.RELEASE_COMMIT,
            sbom: 'racoon-typper.sbom.cdx.json',
            provenance: 'PROVENANCE_ATTESTATION.md',
            reproducibility: 'Native builds are rebuilt from tagged source on GitHub-hosted runners; byte-for-byte reproducibility is not claimed.',
          }, null, 2)}\n`);
          NODE
      - name: Generate torrent for the Linux tarball
        # Produces a single .torrent for the main Linux tarball. It carries a
        # webseed pointing at the public release-asset URL, so a BitTorrent
        # client can still complete the download with zero peers. Placed before
        # the checksum step so the .torrent itself is covered by SHA256SUMS.
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq transmission-cli
          TARBALL="racoon-typper-${RELEASE_TAG}-x86_64.tar.gz"
          TARBALL_PATH="$(find artifacts -name "$TARBALL" -type f | head -1)"
          test -n "$TARBALL_PATH" || { echo "tarball $TARBALL not found in artifacts/"; exit 1; }
          # transmission-create 4.0.5 (Ubuntu noble) mishandles --anonymous:
          # it reports a spurious "Cannot find specified input file" and aborts.
          # --anonymous makes the torrent private, which we do not need given
          # the direct webseed and GitHub release assets, so it is omitted.
          TARBALL_ABS="$(realpath "$TARBALL_PATH")"
          WEBSEED="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${TARBALL}"
          transmission-create "$TARBALL_ABS" \
            --outfile "artifacts/${TARBALL}.torrent" \
            --comment "Racoon Typper ${RELEASE_TAG} — Linux x86_64 tarball" \
            --webseed "$WEBSEED"
      - name: Sign updater artifacts and generate latest.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd artifacts
          # Sign the AppImage (Linux) and NSIS installer (Windows) for the
          # updater. The updater verifies these signatures before installing.
          # Artifacts are extracted into per-job subdirectories, so search the
          # whole tree rather than relying on a flat glob.
          while IFS= read -r -d '' f; do
            npx --yes @tauri-apps/cli signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "$f"
          done < <(find . -type f \( -name '*.AppImage' -o -name '*.exe' \) -print0)
      - name: Generate latest.json for the updater
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          # The updater endpoint serves latest.json. It lists the signed
          # installers per platform; the updater picks the matching one.
          # Files live in per-job subdirectories, so find them recursively.
          node -e '
            const tag = process.env.RELEASE_TAG;
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}`;
            const fs = require("fs");
            const path = require("path");
            const version = tag.replace("v", "");
            function findFile(name) {
              const hits = [];
              function walk(dir) {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) walk(full);
                  else if (entry.name === name) hits.push(full);
                }
              }
              walk(".");
              return hits.length > 0;
            }
            const notes = [];
            const add = (platform, arch, file, sig) => {
              if (findFile(file)) {
                notes.push({ platform, arch, url: `${base}/${file}`, signature: sig ? `${base}/${sig}` : null });
              }
            };
            const appImage = `racoon-typper_${version}_amd64.AppImage`;
            const setupExe = `racoon-typper_${version}_x64-setup.exe`;
            add("linux-x86_64", "x86_64", appImage, `${appImage}.sig`);
            add("windows-x86_64", "x86_64", setupExe, `${setupExe}.sig`);
            const manifest = { version, notes: "", pub_date: new Date().toISOString(), platforms: { "linux-x86_64": notes.filter(n=>n.platform==="linux-x86_64"), "windows-x86_64": notes.filter(n=>n.platform==="windows-x86_64") } };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          '
      # Checksums are generated last so every attached asset — including the
      # updater signatures and latest.json produced above — is covered, and
      # entries use flat basenames matching a plain release download.
      - name: Generate checksums for the exact release asset set
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          : > SHA256SUMS
          while IFS= read -r -d '' f; do
            hash=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$f")" >> SHA256SUMS
          done < <(find . -type f \( \
            -name 'racoon-typper*.deb' -o -name 'racoon-typper*.rpm' -o \
            -name 'racoon-typper*.AppImage' -o -name 'racoon-typper*.AppImage.sig' -o \
            -name 'racoon-typper*_x64-setup.exe' -o -name 'racoon-typper*_x64-setup.exe.sig' -o \
            -name 'racoon-typper*-x86_64.tar.gz' -o -name 'racoon-typper*-x86_64.tar.gz.torrent' \
            \) -print0)
          for f in latest.json release-evidence/*; do
            hash=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$hash" "$(basename "$f")" >> SHA256SUMS
          done
          test "$(wc -l < SHA256SUMS)" -ge 12 || { echo "unexpectedly few checksum entries"; exit 1; }
          sort -k 2 -o SHA256SUMS SHA256SUMS

      - name: Create draft release candidate
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: Racoon Typper ${{ needs.validate-tag.outputs.tag }} RC
          draft: true
          prerelease: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
            artifacts/**/*.torrent
            artifacts/**/*.exe
            artifacts/**/*.sig
            artifacts/SHA256SUMS
            artifacts/latest.json
            artifacts/release-evidence/*
          body: |
            Release candidate built from the immutable tag above.

            Verify SHA256SUMS before installation. Promotion requires the protected release-promotion environment.
