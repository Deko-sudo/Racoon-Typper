name: Release candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]
          git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify tag matches project version
        shell: bash
        run: |
          set -euo pipefail
          expected='${{ inputs.tag }}'
          expected="${expected#v}"
          actual="$(node scripts/check-version.mjs --print)"
          test "$actual" = "$expected"

  build-linux:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build Tauri app
        run: npm run tauri:build:ci --prefix frontend
      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          tar czf racoon-typper-${{ needs.validate-tag.outputs.tag }}-x86_64.tar.gz -C target/release racoon-app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: racoon-typper-linux
          path: |
            target/release/bundle/**
            racoon-typper-*.tar.gz
          if-no-files-found: error

  validate-flatpak-manifest:
    needs: validate-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node scripts/validate-flatpak-manifest.mjs

  build-windows:
    needs: validate-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build NSIS installer
        run: npm run tauri:build:ci --prefix frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: racoon-typper-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  windows-installer-smoke:
    needs: [validate-tag, build-windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: racoon-typper-windows
          path: artifacts
      - name: Install, launch, persist, and restart NSIS package
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path artifacts -Filter '*.exe' -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $installer) { throw 'NSIS installer artifact was not found' }
          ./scripts/windows-nsis-smoke.ps1 -Installer $installer

  linux-package-smoke:
    needs: [validate-tag, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: racoon-typper-linux
          path: artifacts
      - name: Install, launch, persist, and restart Debian package
        shell: bash
        run: |
          set -euo pipefail
          package="$(find artifacts -type f -name '*.deb' -print -quit)"
          test -n "$package"
          bash scripts/linux-package-smoke.sh "$package"

  publish-draft:
    needs: [validate-tag, build-linux, build-windows, linux-package-smoke, windows-installer-smoke, validate-flatpak-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-tag.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Attach SBOM and provenance records
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          export RELEASE_COMMIT="$(git rev-parse HEAD)"
          test -s licenses/sbom.cdx.json
          test -s licenses/PROVENANCE_ATTESTATION.md
          mkdir -p artifacts/release-evidence
          cp licenses/sbom.cdx.json artifacts/release-evidence/racoon-typper.sbom.cdx.json
          cp licenses/PROVENANCE_ATTESTATION.md artifacts/release-evidence/PROVENANCE_ATTESTATION.md
          node - <<'NODE' > artifacts/release-evidence/release-manifest.json
          const fs = require('node:fs');
          const sbom = JSON.parse(fs.readFileSync('licenses/sbom.cdx.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (sbom.metadata?.component?.version !== tag.slice(1)) {
            throw new Error('SBOM component version does not match release tag');
          }
          process.stdout.write(`${JSON.stringify({
            schema: 1,
            tag,
            commit: process.env.RELEASE_COMMIT,
            sbom: 'racoon-typper.sbom.cdx.json',
            provenance: 'PROVENANCE_ATTESTATION.md',
            reproducibility: 'Native builds are rebuilt from tagged source on GitHub-hosted runners; byte-for-byte reproducibility is not claimed.',
          }, null, 2)}\n`);
          NODE
      - name: Generate torrent for the Linux tarball
        # Produces a single .torrent for the main Linux tarball. It carries a
        # webseed pointing at the public release-asset URL, so a BitTorrent
        # client can still complete the download with zero peers. Placed before
        # the checksum step so the .torrent itself is covered by SHA256SUMS.
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq transmission-cli
          TARBALL="racoon-typper-${RELEASE_TAG}-x86_64.tar.gz"
          TARBALL_PATH="$(find artifacts -name "$TARBALL" -type f | head -1)"
          test -n "$TARBALL_PATH" || { echo "tarball $TARBALL not found in artifacts/"; exit 1; }
          # transmission-create 4.0.5 (Ubuntu noble) mishandles --anonymous:
          # it reports a spurious "Cannot find specified input file" and aborts.
          # --anonymous makes the torrent private, which we do not need given
          # the direct webseed and GitHub release assets, so it is omitted.
          TARBALL_ABS="$(realpath "$TARBALL_PATH")"
          WEBSEED="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${TARBALL}"
          transmission-create "$TARBALL_ABS" \
            --outfile "artifacts/${TARBALL}.torrent" \
            --comment "Racoon Typper ${RELEASE_TAG} — Linux x86_64 tarball" \
            --webseed "$WEBSEED"
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Sign updater artifacts and generate latest.json
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cd artifacts
          # Sign the AppImage (Linux) and NSIS installer (Windows) for the
          # updater. The updater verifies these signatures before installing.
          # Artifacts are extracted into per-job subdirectories, so search the
          # whole tree rather than relying on a flat glob.
          while IFS= read -r -d '' f; do
            npx --yes @tauri-apps/cli signer sign \
              --private-key "$TAURI_SIGNING_PRIVATE_KEY" \
              --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" \
              "$f"
          done < <(find . -type f \( -name '*.AppImage' -o -name '*.exe' \) -print0)
      - name: Generate latest.json for the updater
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          set -euo pipefail
          cd artifacts
          # The updater endpoint serves latest.json. It lists the signed
          # installers per platform; the updater picks the matching one.
          # Files live in per-job subdirectories, so find them recursively.
          node -e '
            const tag = process.env.RELEASE_TAG;
            const base = `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}`;
            const fs = require("fs");
            const path = require("path");
            const version = tag.replace("v", "");
            function findFile(name) {
              const hits = [];
              function walk(dir) {
                for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                  const full = path.join(dir, entry.name);
                  if (entry.isDirectory()) walk(full);
                  else if (entry.name === name) hits.push(full);
                }
              }
              walk(".");
              return hits.length > 0;
            }
            const notes = [];
            const add = (platform, arch, file, sig) => {
              if (findFile(file)) {
                notes.push({ platform, arch, url: `${base}/${file}`, signature: sig ? `${base}/${sig}` : null });
              }
            };
            const appImage = `racoon-typper_${version}_amd64.AppImage`;
            const setupExe = `racoon-typper_${version}_x64-setup.exe`;
            add("linux-x86_64", "x86_64", appImage, `${appImage}.sig`);
            add("windows-x86_64", "x86_64", setupExe, `${setupExe}.sig`);
            const manifest = { version, notes: "", pub_date: new Date().toISOString(), platforms: { "linux-x86_64": notes.filter(n=>n.platform==="linux-x86_64"), "windows-x86_64": notes.filter(n=>n.platform==="windows-x86_64") } };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2));
          '
      - name: Create draft release candidate
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate-tag.outputs.tag }}
          name: Racoon Typper ${{ needs.validate-tag.outputs.tag }} RC
          draft: true
          prerelease: true
          files: |
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.AppImage
            artifacts/**/*.tar.gz
            artifacts/**/*.torrent
            artifacts/**/*.exe
            artifacts/**/*.sig
            artifacts/SHA256SUMS
            artifacts/latest.json
            artifacts/release-evidence/*
          body: |
            Release candidate built from the immutable tag above.

            Verify SHA256SUMS before installation. Promotion requires the protected release-promotion environment.
