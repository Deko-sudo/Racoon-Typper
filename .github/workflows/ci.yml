name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          components: clippy, rustfmt
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Check project version
        run: npm run check:version --prefix frontend
      - name: Check IPC command registration contract
        run: npm run check:ipc-contracts --prefix frontend
      - name: Check frontend
        run: npm run check --prefix frontend
      - name: Test frontend UI helpers
        run: npm run test:ui --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  license-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2
      - name: Validate Rust dependency licenses
        run: cargo deny check licenses
      - name: Validate project and npm licenses
        run: npm run license:check --prefix frontend
      - name: Upload licensing reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: racoon-typper-licensing-reports
          path: |
            licenses/assets.json
            licenses/ASSET_PROVENANCE.md
            licenses/PROVENANCE_ATTESTATION.md
            licenses/dependencies.json
            licenses/sbom.cdx.json
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
