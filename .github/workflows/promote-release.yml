name: Promote release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to promote
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: release-promotion
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          tag='${{ inputs.tag }}'
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]
          git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null
      - name: Publish approved release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ inputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
