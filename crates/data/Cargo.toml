[package]
name = "racoon-data"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# Enables integration-test-only seams. This is intentionally non-default so
# normal consumers cannot construct a failure-injecting finalizer.
test-support = []
# Extends test support with an abrupt child-process crash seam. This is never
# enabled by default or by a production crate.
crash-test-support = ["test-support"]

[dependencies]
racoon-application = { workspace = true }
racoon-domain = { workspace = true }
racoon-core = { workspace = true }
# `backup` exposes SQLite's Online Backup API (rusqlite::backup::Backup), which
# produces a transactionally consistent single-file snapshot with the WAL fully
# applied. This is the only safe way to copy a WAL-mode database; an `fs::copy`
# of `data.db` alone loses un-checkpointed WAL contents, and a multi-file copy
# of `data.db` + `-wal` + `-shm` is not atomic across the three files.
rusqlite = { version = "0.39", features = ["bundled", "backup"] }
refinery = { version = "0.9", features = ["rusqlite"] }
chrono = "0.4"
serde = { workspace = true }
serde_json = { workspace = true, features = ["raw_value"] }
toml = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
serde_json = { workspace = true }
